<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="分场景的英语口语模板站：先给句型模板，替换空格自己造句。附易经文化行业专业单词本。">
<link rel="manifest" href="manifest.json">
<title>开口说</title>
<style>
:root{
  --bg:#0d1117; --bg2:#131a24; --card:#161e2a; --card2:#1c2634; --card3:#232f40;
  --ink:#e8edf5; --ink2:#9aa8bd; --ink3:#64748b;
  --acc:#3ddc97; --acc2:#2bb47c; --acc-dim:rgba(61,220,151,.13);
  --warm:#f5a623; --warm-dim:rgba(245,166,35,.13);
  --blue:#5b9dff; --blue-dim:rgba(91,157,255,.13); --red:#ff6b6b;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.65;
  overflow:hidden;position:fixed;width:100%;
  background-image:
    radial-gradient(110% 50% at 50% -6%, rgba(61,220,151,.09), transparent 62%),
    radial-gradient(80% 40% at 50% 106%, rgba(91,157,255,.05), transparent 60%);
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit}

/* ===== 图标 ===== */
.i{width:20px;height:20px;flex:none;display:block;
  stroke:currentColor;stroke-width:1.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.i.sm{width:16px;height:16px;stroke-width:1.8}
.i.lg{width:24px;height:24px;stroke-width:1.5}
.i.xl{width:30px;height:30px;stroke-width:1.4}
.i.fill{fill:currentColor}

/* ===== 顶栏 ===== */
.top{height:calc(52px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;gap:10px;padding-left:12px;padding-right:12px;
  border-bottom:1px solid var(--line);flex:none;position:relative;z-index:20;
  background:rgba(13,17,23,.86);backdrop-filter:blur(12px)}
.top .back{width:34px;height:34px;display:none;align-items:center;justify-content:center;
  border-radius:11px;background:var(--card2);flex:none;color:var(--ink2)}
.top .back.on{display:flex}
.top .ttl{font-size:16.5px;font-weight:650;letter-spacing:.3px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:4px}
.top .sub{font-size:11px;color:var(--ink3);letter-spacing:1.5px;font-weight:400;margin-left:5px}
.top .act{width:34px;height:34px;display:none;align-items:center;justify-content:center;
  border-radius:11px;color:var(--ink2);flex:none}
.top .act.on{display:flex}
.top .act:active{background:var(--card2);color:var(--acc)}

/* ===== 主体 ===== */
#app{position:absolute;top:calc(52px + env(safe-area-inset-top));
  bottom:calc(58px + env(safe-area-inset-bottom));left:0;right:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.view{display:none;padding:16px 14px 40px;animation:fade .28s ease}
.view.on{display:block}
.wrap{max-width:none;margin:0 auto}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== 通用 ===== */
.sec{display:flex;align-items:center;gap:10px;margin:24px 2px 12px}
.sec:first-child{margin-top:2px}
.sec .t{font-size:12.5px;letter-spacing:2.5px;color:var(--acc);white-space:nowrap;font-weight:600}
.sec .l{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.sec .n{font-size:11px;color:var(--ink3)}
.searchbox{position:relative;margin-bottom:14px}
.searchbox input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);
  border-radius:13px;background:var(--card);font-size:15px;color:var(--ink)}
.searchbox input::placeholder{color:var(--ink3)}
.searchbox input:focus{outline:none;border-color:rgba(61,220,151,.45);box-shadow:0 0 0 3px var(--acc-dim)}
.searchbox .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.empty{text-align:center;color:var(--ink3);font-size:13.5px;padding:44px 20px;line-height:2}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;
  font-size:11px;background:var(--card3);color:var(--ink2);white-space:nowrap;vertical-align:middle}
.pill.acc{background:var(--acc-dim);color:var(--acc)}
.pill.warm{background:var(--warm-dim);color:var(--warm)}

/* ===== 首页 ===== */
.hero{background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-34px;top:-34px;width:130px;height:130px;
  border-radius:50%;background:radial-gradient(circle,rgba(61,220,151,.14),transparent 70%)}
.hero h3{font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:8px;margin-bottom:5px}
.hero h3 .i{color:var(--acc)}
.hero p{font-size:12.5px;color:var(--ink2);line-height:1.75;position:relative;z-index:2}
.hero .go{margin-top:13px;display:inline-flex;align-items:center;gap:6px;
  padding:9px 15px 9px 16px;border-radius:11px;background:var(--acc);color:#08130d;
  font-size:13.5px;font-weight:650;position:relative;z-index:2}
.hero .go:active{background:var(--acc2)}
.hero .go .i{stroke-width:2.2;width:15px;height:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 2px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:700;color:var(--acc);line-height:1.35}
.stat span{font-size:11px;color:var(--ink3)}

/* ===== 分组格 ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:11px}
.gcard{background:linear-gradient(155deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:var(--r);padding:15px 13px;transition:transform .14s,border-color .2s;
  text-align:left;position:relative;overflow:hidden}
.gcard:active{transform:scale(.975);border-color:var(--line2)}
.gcard .ib{width:38px;height:38px;border-radius:12px;background:var(--acc-dim);color:var(--acc);
  display:flex;align-items:center;justify-content:center;margin-bottom:11px}
.gcard .nm{font-size:15px;font-weight:650;margin-bottom:3px}
.gcard .ds{font-size:11.5px;color:var(--ink3);line-height:1.55}
.gcard .ct{position:absolute;top:14px;right:14px;font-size:10.5px;color:var(--ink3);
  background:var(--card3);padding:2px 7px;border-radius:9px}

/* ===== 场景列表（无图标，靠排版分层）===== */
.slist{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;text-align:left;width:100%}
.srow:active{background:var(--card2)}
.srow .ix{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:none;
  width:20px;text-align:center;font-weight:600}
.srow .bar{width:2.5px;height:26px;border-radius:2px;background:var(--acc);opacity:.45;flex:none}
.srow.done .bar{opacity:1}
.srow .tx{flex:1;min-width:0}
.srow .nm{font-size:15px;font-weight:600;line-height:1.4}
.srow .en{font-size:11.5px;color:var(--ink3);letter-spacing:.3px}
.srow .ar{color:var(--ink3);flex:none}
.srow .ar .i{width:17px;height:17px}

/* ===== 模板卡 ===== */
.pcard{background:linear-gradient(160deg,rgba(61,220,151,.055),var(--card) 60%);
  border:1px solid rgba(61,220,151,.3);border-radius:var(--r);padding:15px;margin-bottom:12px}
.pcard.plain{background:var(--card);border-color:var(--line)}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.phead .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  color:var(--acc);background:var(--acc-dim);padding:3px 9px;border-radius:20px}
.phead .tag .i{width:13px;height:13px}
.phead .sp{flex:1}
.ppat{font-size:20px;font-weight:600;line-height:1.55;letter-spacing:.2px;
  font-family:"SF Pro Display",-apple-system,"Helvetica Neue",sans-serif;word-spacing:.02em}
.slot{display:inline-block;min-width:64px;text-align:center;color:var(--acc);
  border-bottom:2px dashed rgba(61,220,151,.55);padding:0 5px;margin:0 1px;
  transition:.2s;line-height:1.3}
.slot.filled{border-bottom-style:solid;background:var(--acc-dim);border-radius:5px 5px 0 0}
.slot.empty{color:var(--ink3)}
.pzh{font-size:14px;color:var(--ink2);margin-top:8px}
.pzh .zs{color:var(--acc);opacity:.9}
.puse{font-size:12.5px;color:var(--ink3);line-height:1.8;margin-top:9px;
  padding-top:9px;border-top:1px dashed var(--line2)}
.pfills{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.pfill{padding:7px 11px;border-radius:10px;background:var(--card3);border:1px solid var(--line);
  font-size:13.5px;line-height:1.35;text-align:left;transition:.15s}
.pfill:active{transform:scale(.95)}
.pfill.on{background:var(--acc);color:#08130d;border-color:var(--acc);font-weight:600}
.pfill .zh{font-size:10.5px;opacity:.62;display:block;margin-top:1px}
.pmeta{font-size:11.5px;color:var(--ink3);margin-top:10px;line-height:1.85}
.pmeta b{color:var(--ink2);font-weight:600}



/* ===== 微对话（聊天气泡）===== */
.dlg{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.bub{max-width:82%;padding:11px 13px;border-radius:15px;position:relative;line-height:1.5}
.bub.t{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.y{align-self:flex-end;background:rgba(61,220,151,.14);border:1px solid rgba(61,220,151,.3);
  border-bottom-right-radius:5px}
.bub .be{font-size:15px;font-weight:550}
.bub.y .be{color:var(--acc)}
.bub .bz{font-size:12px;color:var(--ink3);margin-top:4px}
.bub .who{font-size:10px;letter-spacing:1px;color:var(--ink3);margin-bottom:3px}
.bub.playing{box-shadow:0 0 0 2px var(--acc)}
.dlgbar{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.dlgbar .btn{padding:10px}
/* 演练：轮到你说时把对方的话糊掉 */
.bub.hide .be,.bub.hide .bz{filter:blur(5px);user-select:none}

/* ===== 折叠（内容多的模块默认收起）===== */
.foldhead{display:block;width:100%;text-align:left;cursor:pointer}
.foldarrow{color:var(--ink3);transition:transform .22s;flex:none}
.foldarrow .i{width:16px;height:16px}
.open .foldarrow{transform:rotate(90deg);color:var(--acc)}
.pcard.fold{padding:13px 14px}
.pcard.fold .pbody{display:none}
.pcard.fold.open .pbody{display:block}
.pcard.fold .ppat{font-size:17px;line-height:1.5}
.pcard.fold.open .ppat{font-size:19.5px}
.pcard.fold .pzh{font-size:12.5px;margin-top:5px}
.pcard.fold.open .pzh{font-size:14px}
.pcard.fold .slot{min-width:52px;font-size:.92em}
.tcard.fold .tdef,.tcard.fold .tnote{display:none}
.tcard.fold.open .tdef,.tcard.fold.open .tnote{display:block}
.secbtn{font-size:11px;color:var(--ink3);padding:4px 10px;border-radius:20px;
  background:var(--card3);white-space:nowrap;flex:none}
.secbtn:active{background:var(--acc-dim);color:var(--acc)}

/* ===== 句子卡 ===== */
.lcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 15px 12px;margin-bottom:11px}
.lcard.top1{border-color:rgba(61,220,151,.28)}
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.stars{display:flex;gap:2px;color:var(--warm)}
.stars .i{width:13px;height:13px;stroke-width:1.7}
.stars .i.off{color:var(--ink3);opacity:.5}
.lhead .fq{font-size:10.5px;color:var(--ink3)}
.lhead .sp{flex:1}
.iconbtn{width:32px;height:32px;border-radius:10px;background:var(--card3);
  display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.iconbtn:active{background:var(--acc-dim);color:var(--acc)}
.iconbtn.on{color:var(--warm)}
.iconbtn.on .i{fill:currentColor}
.len{font-size:18.5px;font-weight:600;line-height:1.5;letter-spacing:.2px;
  font-family:"SF Pro Display",-apple-system,"Helvetica Neue",sans-serif}
.lzh{font-size:13.5px;color:var(--ink2);margin-top:6px}
.lmore{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line2);display:none;font-size:13px;line-height:1.85}
.lmore.on{display:block}
.lmore .r{display:flex;gap:9px;margin-bottom:7px}
.lmore .r:last-child{margin-bottom:0}
.lmore .k{flex:none;font-size:11px;color:var(--ink3);width:50px;padding-top:3px;letter-spacing:.5px}
.lmore .v{flex:1;color:var(--ink2)}
.lmore .v em{font-style:normal;color:var(--ink)}
.togmore{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;
  font-size:11.5px;color:var(--ink3);padding:8px 0 0;letter-spacing:.5px}
.togmore .i{width:13px;height:13px;transition:transform .2s}
.togmore.open .i{transform:rotate(90deg)}

/* ===== 单词本 ===== */
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.thead{display:flex;align-items:flex-start;gap:9px}
.ten{font-size:16.5px;font-weight:650;line-height:1.45;flex:1}
.tzh{font-size:13.5px;color:var(--acc);margin-top:2px}
.tpy{font-size:11.5px;color:var(--ink3);font-style:italic;margin-top:1px}
.tdef{font-size:13px;color:var(--ink2);margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);line-height:1.75}
.tnote{font-size:12.5px;color:var(--ink3);margin-top:6px;line-height:1.8}
.tnote b{color:var(--warm);font-weight:600}

/* ===== 练习 ===== */
.modes{display:grid;gap:10px}
.mode{display:flex;align-items:center;gap:13px;background:linear-gradient(150deg,var(--card2),var(--card));
  border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.mode:active{transform:scale(.985);border-color:var(--line2)}
.mode .ib{width:42px;height:42px;border-radius:13px;background:var(--acc-dim);color:var(--acc);
  display:flex;align-items:center;justify-content:center;flex:none}
.mode.w .ib{background:var(--warm-dim);color:var(--warm)}
.mode.b .ib{background:var(--blue-dim);color:var(--blue)}
.mode .nm{font-size:15px;font-weight:650;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.mode .ds{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.55}
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qbar .pg{flex:1;height:5px;border-radius:3px;background:var(--card3);overflow:hidden}
.qbar .pg i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.qbar .nm{font-size:11.5px;color:var(--ink3);flex:none;font-variant-numeric:tabular-nums}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 16px;margin-bottom:14px;text-align:center;min-height:108px;
  display:flex;flex-direction:column;justify-content:center;gap:8px}
.qbox .qz{font-size:19px;font-weight:600;line-height:1.6}
.qbox .qh{font-size:12px;color:var(--ink3)}
.qbox .ppat{font-size:19px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;
  text-align:left;font-size:14.5px;line-height:1.5;width:100%;transition:.18s}
.opt:active{background:var(--card2)}
.opt.right{border-color:var(--acc);background:var(--acc-dim);color:var(--acc)}
.opt.wrong{border-color:var(--red);background:rgba(255,107,107,.1);color:var(--red)}
.opt.dim{opacity:.4}
.opt .zh{font-size:11.5px;color:var(--ink3);display:block;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:44px;
  padding:12px;background:var(--bg2);border-radius:13px;border:1px dashed var(--line2);margin-bottom:12px}
.chip{padding:8px 12px;border-radius:10px;background:var(--card3);font-size:14.5px;
  border:1px solid var(--line);line-height:1.2}
.chip:active{transform:scale(.94)}
.chip.used{opacity:.25;pointer-events:none}
.ansbox{min-height:52px;padding:12px;background:var(--card);border:1px solid var(--acc);
  border-radius:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin-bottom:12px}
.ansbox:empty::before{content:"点下面的词，按顺序组成句子";color:var(--ink3);font-size:12.5px}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:13px;border-radius:13px;background:var(--card3);font-size:14.5px;
  font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{opacity:.8}
.btn.main{background:var(--acc);color:#08130d}
.btn.gh{border:1px solid var(--line2);background:transparent;color:var(--ink2)}
.btn .i{width:16px;height:16px}
.fb{border-radius:14px;padding:14px;margin-top:14px;font-size:13.5px;line-height:1.8;display:none}
.fb.on{display:block;animation:fade .25s}
.fb.ok{background:var(--acc-dim);border:1px solid rgba(61,220,151,.3)}
.fb.no{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3)}
.fb .t{font-weight:650;margin-bottom:5px;font-size:14px;display:flex;align-items:center;gap:6px}
.fb.ok .t{color:var(--acc)} .fb.no .t{color:var(--red)}
.fb .en{font-size:15px;font-weight:600;margin:6px 0 3px}
.fb .zh{color:var(--ink2);font-size:13px}
.mic{width:96px;height:96px;border-radius:50%;background:var(--acc);color:#08130d;
  display:flex;align-items:center;justify-content:center;margin:6px auto 12px;
  box-shadow:0 8px 30px rgba(61,220,151,.22);transition:.2s}
.mic .i{width:34px;height:34px;stroke-width:1.7}
.mic:active{transform:scale(.94)}
.mic.rec{background:var(--red);color:#fff;animation:pulse 1.3s infinite;box-shadow:0 8px 30px rgba(255,107,107,.32)}
.mic.busy{background:var(--card3);color:var(--ink3);box-shadow:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.score{font-size:40px;font-weight:750;text-align:center;line-height:1.2;font-variant-numeric:tabular-nums}
.score small{font-size:15px;font-weight:500;color:var(--ink3);display:block;margin-top:2px}
.heard{font-size:14px;text-align:center;margin-top:10px;line-height:1.9}
.heard .g{color:var(--acc)}
.heard .m{color:var(--ink3);border-bottom:1px dotted var(--ink3)}

/* ===== 我的 ===== */
.mrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;width:100%;text-align:left;margin-bottom:9px}
.mrow:active{background:var(--card2)}
.mrow .ib{width:32px;height:32px;border-radius:10px;background:var(--card3);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;flex:none}
.mrow .tx{flex:1}
.mrow .nm{font-size:14.5px;font-weight:600}
.mrow .ds{font-size:11.5px;color:var(--ink3);margin-top:1px}
.mrow .vl{font-size:13px;color:var(--acc);flex:none;font-variant-numeric:tabular-nums}
.mrow .vl.red{color:var(--red)}
.sw{width:44px;height:25px;border-radius:14px;background:var(--card3);position:relative;flex:none;transition:.22s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
  background:var(--ink2);transition:.22s}
.sw.on{background:var(--acc)}
.sw.on::after{left:22px;background:#08130d}

/* ===== 底栏（色块+字）===== */
.tabbar{position:absolute;bottom:0;left:0;right:0;
  height:calc(58px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:flex;border-top:1px solid var(--line);background:rgba(13,17,23,.94);
  backdrop-filter:blur(14px);z-index:30}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tab .bk{width:30px;height:30px;border-radius:9px;background:var(--card3);
  display:flex;align-items:center;justify-content:center;font-size:14px;
  color:var(--ink2);transition:.2s;font-weight:600}
.tab .lb{font-size:10.5px;color:var(--ink3);letter-spacing:.3px}
.tab.on .bk{background:var(--acc);color:#08130d}
.tab.on .lb{color:var(--acc)}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(10px);background:rgba(28,38,52,.97);
  border:1px solid var(--line2);color:var(--ink);padding:10px 18px;border-radius:12px;
  font-size:13.5px;z-index:99;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;
  max-width:88vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:700px){
  .view{padding:20px 24px 48px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(185px,1fr))}
}
</style>
