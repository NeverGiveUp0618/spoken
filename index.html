<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="分场景的英语口语速成：每个场景三句，按使用频率排序，附易经文化行业专业单词本。">
<link rel="manifest" href="manifest.json">
<title>开口说</title>
<style>
:root{
  --bg:#0d1117; --bg2:#131a24; --card:#161e2a; --card2:#1c2634; --card3:#232f40;
  --ink:#e8edf5; --ink2:#9aa8bd; --ink3:#64748b;
  --acc:#3ddc97; --acc2:#2bb47c; --acc-dim:rgba(61,220,151,.14);
  --warm:#f5a623; --warm-dim:rgba(245,166,35,.14);
  --blue:#5b9dff; --red:#ff6b6b;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.65;
  overflow:hidden;position:fixed;width:100%;
  background-image:
    radial-gradient(110% 50% at 50% -6%, rgba(61,220,151,.10), transparent 62%),
    radial-gradient(80% 40% at 50% 106%, rgba(91,157,255,.06), transparent 60%);
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit}

/* ===== 顶栏 ===== */
.top{
  height:calc(52px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;gap:10px;padding-left:14px;padding-right:14px;
  border-bottom:1px solid var(--line);flex:none;position:relative;z-index:20;
  background:rgba(13,17,23,.86);backdrop-filter:blur(12px)}
.top .back{width:32px;height:32px;display:none;align-items:center;justify-content:center;
  border-radius:10px;background:var(--card2);flex:none;font-size:17px;color:var(--ink2)}
.top .back.on{display:flex}
.top .ttl{font-size:16.5px;font-weight:650;letter-spacing:.5px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{font-size:11px;color:var(--ink3);letter-spacing:1.5px;font-weight:400}
.top .act{width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border-radius:10px;color:var(--ink2);font-size:16px;flex:none}
.top .act:active{background:var(--card2)}

/* ===== 主体 ===== */
#app{position:absolute;top:calc(52px + env(safe-area-inset-top));
  bottom:calc(58px + env(safe-area-inset-bottom));left:0;right:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.view{display:none;padding:16px 14px 40px;animation:fade .28s ease}
.view.on{display:block}
.wrap{max-width:none;margin:0 auto}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== 通用件 ===== */
.sec{display:flex;align-items:center;gap:10px;margin:22px 2px 12px}
.sec:first-child{margin-top:4px}
.sec .t{font-size:12.5px;letter-spacing:2.5px;color:var(--acc);white-space:nowrap;font-weight:600}
.sec .l{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.sec .n{font-size:11px;color:var(--ink3);letter-spacing:.5px}
.searchbox{position:relative;margin-bottom:14px}
.searchbox input{width:100%;padding:12px 14px 12px 38px;border:1px solid var(--line);
  border-radius:13px;background:var(--card);font-size:15px;color:var(--ink)}
.searchbox input::placeholder{color:var(--ink3)}
.searchbox input:focus{outline:none;border-color:rgba(61,220,151,.45);
  box-shadow:0 0 0 3px var(--acc-dim)}
.searchbox .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  font-size:14px;opacity:.5}
.empty{text-align:center;color:var(--ink3);font-size:13.5px;padding:44px 20px;line-height:2}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
  font-size:11.5px;background:var(--card3);color:var(--ink2);white-space:nowrap}
.pill.acc{background:var(--acc-dim);color:var(--acc)}
.pill.warm{background:var(--warm-dim);color:var(--warm)}

/* ===== 首页 ===== */
.hero{background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:var(--r);padding:16px;margin-bottom:6px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;
  border-radius:50%;background:radial-gradient(circle,rgba(61,220,151,.16),transparent 70%)}
.hero h3{font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:7px;margin-bottom:4px}
.hero p{font-size:12.5px;color:var(--ink2);line-height:1.7}
.hero .go{margin-top:12px;display:inline-flex;align-items:center;gap:6px;
  padding:9px 16px;border-radius:11px;background:var(--acc);color:#08130d;
  font-size:13.5px;font-weight:650;position:relative;z-index:2}
.hero .go:active{background:var(--acc2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:12px 8px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:700;color:var(--acc);line-height:1.3}
.stat span{font-size:11px;color:var(--ink3)}

/* ===== 分组格 ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.gcard{background:linear-gradient(155deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:var(--r);padding:15px 13px;transition:transform .14s,border-color .2s;
  text-align:left;position:relative;overflow:hidden}
.gcard:active{transform:scale(.975);border-color:var(--line2)}
.gcard .ic{font-size:24px;line-height:1;margin-bottom:9px;display:block}
.gcard .nm{font-size:15px;font-weight:650;margin-bottom:3px}
.gcard .ds{font-size:11.5px;color:var(--ink3);line-height:1.55}
.gcard .ct{position:absolute;top:13px;right:13px;font-size:10.5px;color:var(--ink3);
  background:var(--card3);padding:2px 7px;border-radius:9px}

/* ===== 场景列表 ===== */
.slist{display:flex;flex-direction:column;gap:9px}
.srow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;text-align:left;width:100%}
.srow:active{background:var(--card2)}
.srow .ic{font-size:21px;flex:none;width:26px;text-align:center}
.srow .tx{flex:1;min-width:0}
.srow .nm{font-size:15px;font-weight:600}
.srow .en{font-size:11.5px;color:var(--ink3);letter-spacing:.3px}
.srow .ar{color:var(--ink3);font-size:15px;flex:none}
.srow .dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none}

/* ===== 句子卡 ===== */
.lcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 15px 13px;margin-bottom:12px;position:relative}
.lcard.top1{border-color:rgba(61,220,151,.32);
  background:linear-gradient(160deg,rgba(61,220,151,.055),var(--card) 55%)}
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.stars{font-size:11.5px;color:var(--warm);letter-spacing:1px}
.lhead .fq{font-size:10.5px;color:var(--ink3)}
.lhead .sp{flex:1}
.iconbtn{width:31px;height:31px;border-radius:10px;background:var(--card3);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;color:var(--ink2)}
.iconbtn:active{background:var(--acc-dim);color:var(--acc)}
.iconbtn.on{color:var(--warm)}
.len{font-size:19px;font-weight:600;line-height:1.5;letter-spacing:.2px;
  font-family:"SF Pro Display",-apple-system,"Helvetica Neue",sans-serif}
.len .hl{color:var(--acc)}
.lzh{font-size:14px;color:var(--ink2);margin-top:7px}
.lmore{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line2);
  display:none;font-size:13px;line-height:1.85}
.lmore.on{display:block}
.lmore .r{display:flex;gap:8px;margin-bottom:7px}
.lmore .r:last-child{margin-bottom:0}
.lmore .k{flex:none;font-size:11px;color:var(--ink3);width:48px;padding-top:3px;letter-spacing:.5px}
.lmore .v{flex:1;color:var(--ink2)}
.lmore .v em{font-style:normal;color:var(--ink)}
.togmore{display:block;width:100%;text-align:center;font-size:11.5px;color:var(--ink3);
  padding:8px 0 0;letter-spacing:1px}

/* ===== 单词本 ===== */
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;margin-bottom:10px}
.thead{display:flex;align-items:flex-start;gap:9px}
.ten{font-size:16.5px;font-weight:650;line-height:1.45;flex:1}
.tzh{font-size:13.5px;color:var(--acc);margin-top:2px}
.tpy{font-size:11.5px;color:var(--ink3);font-style:italic;margin-top:1px}
.tdef{font-size:13px;color:var(--ink2);margin-top:9px;padding-top:9px;
  border-top:1px dashed var(--line);line-height:1.75}
.tnote{font-size:12.5px;color:var(--ink3);margin-top:6px;line-height:1.8}
.tnote b{color:var(--warm);font-weight:600}

/* ===== 练习 ===== */
.modes{display:grid;gap:11px;margin-bottom:6px}
.mode{display:flex;align-items:center;gap:13px;background:linear-gradient(150deg,var(--card2),var(--card));
  border:1px solid var(--line);border-radius:var(--r);padding:15px 14px;text-align:left;width:100%}
.mode:active{transform:scale(.985);border-color:var(--line2)}
.mode .ic{width:42px;height:42px;border-radius:13px;background:var(--acc-dim);color:var(--acc);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.mode.w .ic{background:var(--warm-dim);color:var(--warm)}
.mode.b .ic{background:rgba(91,157,255,.14);color:var(--blue)}
.mode .nm{font-size:15px;font-weight:650}
.mode .ds{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.55}
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qbar .pg{flex:1;height:5px;border-radius:3px;background:var(--card3);overflow:hidden}
.qbar .pg i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.qbar .nm{font-size:11.5px;color:var(--ink3);flex:none}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 16px;margin-bottom:14px;text-align:center;min-height:110px;
  display:flex;flex-direction:column;justify-content:center;gap:8px}
.qbox .qz{font-size:19px;font-weight:600;line-height:1.6}
.qbox .qh{font-size:12px;color:var(--ink3)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;
  text-align:left;font-size:14.5px;line-height:1.5;width:100%;transition:.18s}
.opt:active{background:var(--card2)}
.opt.right{border-color:var(--acc);background:var(--acc-dim);color:var(--acc)}
.opt.wrong{border-color:var(--red);background:rgba(255,107,107,.1);color:var(--red)}
.opt.dim{opacity:.42}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:44px;
  padding:12px;background:var(--bg2);border-radius:13px;border:1px dashed var(--line2);margin-bottom:12px}
.chip{padding:8px 12px;border-radius:10px;background:var(--card3);font-size:14.5px;
  border:1px solid var(--line);line-height:1.2}
.chip:active{transform:scale(.94)}
.chip.used{opacity:.25;pointer-events:none}
.ansbox{min-height:52px;padding:12px;background:var(--card);border:1px solid var(--acc);
  border-radius:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin-bottom:12px}
.ansbox:empty::before{content:"点下面的词，按顺序组成句子";color:var(--ink3);font-size:12.5px}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:13px;border-radius:13px;background:var(--card3);font-size:14.5px;
  font-weight:600;text-align:center}
.btn:active{opacity:.8}
.btn.main{background:var(--acc);color:#08130d}
.btn.gh{border:1px solid var(--line2);background:transparent;color:var(--ink2)}
.fb{border-radius:14px;padding:14px;margin-top:14px;font-size:13.5px;line-height:1.8;display:none}
.fb.on{display:block;animation:fade .25s}
.fb.ok{background:var(--acc-dim);border:1px solid rgba(61,220,151,.3)}
.fb.no{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.3)}
.fb .t{font-weight:650;margin-bottom:5px;font-size:14px}
.fb.ok .t{color:var(--acc)} .fb.no .t{color:var(--red)}
.fb .en{font-size:15px;font-weight:600;margin:6px 0 3px}
.fb .zh{color:var(--ink2);font-size:13px}

/* 跟读 */
.mic{width:96px;height:96px;border-radius:50%;background:var(--acc);color:#08130d;
  display:flex;align-items:center;justify-content:center;font-size:36px;margin:6px auto 12px;
  box-shadow:0 8px 30px rgba(61,220,151,.25);transition:.2s}
.mic:active{transform:scale(.94)}
.mic.rec{background:var(--red);color:#fff;animation:pulse 1.3s infinite;
  box-shadow:0 8px 30px rgba(255,107,107,.35)}
.mic.busy{background:var(--card3);color:var(--ink3);box-shadow:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.score{font-size:40px;font-weight:750;text-align:center;line-height:1.2}
.score small{font-size:15px;font-weight:500;color:var(--ink3);display:block;margin-top:2px}
.heard{font-size:14px;text-align:center;margin-top:10px;line-height:1.8}
.heard .g{color:var(--acc)} .heard .b{color:var(--red);text-decoration:line-through;opacity:.75}
.heard .m{color:var(--ink3);border-bottom:1px dotted var(--ink3)}

/* ===== 我的 ===== */
.mrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px;width:100%;text-align:left;margin-bottom:9px}
.mrow:active{background:var(--card2)}
.mrow .ic{font-size:18px;width:24px;text-align:center;flex:none}
.mrow .tx{flex:1}.mrow .nm{font-size:14.5px;font-weight:600}
.mrow .ds{font-size:11.5px;color:var(--ink3);margin-top:1px}
.mrow .vl{font-size:13px;color:var(--acc);flex:none}
.sw{width:44px;height:25px;border-radius:14px;background:var(--card3);position:relative;flex:none;
  transition:.22s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
  background:var(--ink2);transition:.22s}
.sw.on{background:var(--acc)}
.sw.on::after{left:22px;background:#08130d}

/* ===== 底栏（色块+字）===== */
.tabbar{position:absolute;bottom:0;left:0;right:0;
  height:calc(58px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:flex;border-top:1px solid var(--line);background:rgba(13,17,23,.94);
  backdrop-filter:blur(14px);z-index:30}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tab .bk{width:30px;height:30px;border-radius:9px;background:var(--card3);
  display:flex;align-items:center;justify-content:center;font-size:14px;
  color:var(--ink2);transition:.2s;font-weight:600}
.tab .lb{font-size:10.5px;color:var(--ink3);letter-spacing:.5px}
.tab.on .bk{background:var(--acc);color:#08130d}
.tab.on .lb{color:var(--acc)}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(10px);background:rgba(28,38,52,.97);
  border:1px solid var(--line2);color:var(--ink);padding:10px 18px;border-radius:12px;
  font-size:13.5px;z-index:99;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;
  max-width:88vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:700px){
  .view{padding:20px 22px 48px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
}
</style>
</head>
<body>

<div class="top">
  <button class="back" id="back">‹</button>
  <div class="ttl" id="ttl">开口说 <span class="sub">SPEAK UP</span></div>
  <button class="act" id="act"></button>
</div>

<div id="app">
  <div class="view on" id="v-home"><div class="wrap"></div></div>
  <div class="view" id="v-terms"><div class="wrap"></div></div>
  <div class="view" id="v-drill"><div class="wrap"></div></div>
  <div class="view" id="v-me"><div class="wrap"></div></div>
</div>

<div class="tabbar">
  <button class="tab on" data-tab="home"><span class="bk">场</span><span class="lb">场景</span></button>
  <button class="tab" data-tab="terms"><span class="bk">词</span><span class="lb">单词本</span></button>
  <button class="tab" data-tab="drill"><span class="bk">练</span><span class="lb">练习</span></button>
  <button class="tab" data-tab="me"><span class="bk">我</span><span class="lb">我的</span></button>
</div>

<div class="toast" id="toast"></div>

<script src="data.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
